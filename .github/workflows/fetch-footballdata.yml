# football-data.co.uk is blocked by Turkish ISPs (it publishes betting odds),
# so the raw CSVs are fetched from a GitHub runner and committed to the repo.
name: fetch-footballdata

on:
  schedule:
    - cron: "0 6 * * 2,5" # Tuesday and Friday mornings, after weekend and midweek rounds
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go run ./cmd/underlap fetch footballdata --out data/raw/footballdata
      # Runs even when some seasons failed, so the ones that did download are
      # kept; the job still ends red because the fetch step failed.
      - name: Commit refreshed CSVs
        if: ${{ !cancelled() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw/footballdata
          git diff --cached --quiet || git commit -m "data: refresh football-data Süper Lig CSVs"
          git push
